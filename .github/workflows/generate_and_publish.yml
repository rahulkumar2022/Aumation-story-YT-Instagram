name: Automated Video Generator & Publisher

on:
  schedule:
    # 1. Daily Short: Every day at 10:00 AM UTC
    - cron: '0 10 * * *'
    # 2. Long-Form Episode: Every 4 days at 2:00 PM UTC
    - cron: '0 14 */4 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose mode to generate'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: sample-video/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Chrome Headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install Python Dependencies
        run: |
          pip install edge-tts numpy scipy requests pytest

      - name: Install Remotion Dependencies
        run: |
          cd sample-video
          npm ci
          npx remotion browser ensure

      - name: Run Test Suite (Unit & Integration Tests)
        run: |
          python3 -m pytest tests/

      - name: Determine Video Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date +'%d') % 4" -eq 0 ]; then
            echo "mode=long" >> $GITHUB_OUTPUT
          else
            echo "mode=short" >> $GITHUB_OUTPUT
          fi

      - name: Run Pipeline (Script + Audio + Remotion Render)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'anthropic/claude-haiku-5.5' }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL || 'recraft/recraft-v4.1-flash-v2' }}
        run: |
          python3 scripts/auto_pipeline.py --mode ${{ steps.mode.outputs.mode }} --generate-images

      - name: Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ steps.mode.outputs.mode }}-video
          path: |
            output/shorts/*.mp4
            output/long/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish Video to Social Platforms
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: "public"
        run: |
          python3 scripts/uploader.py

      - name: Commit Queue & Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s output/publishing_queue.json) ]]; then
            git add output/publishing_queue.json
            git commit -m "chore(auto): enqueued and published ${{ steps.mode.outputs.mode }} video [skip ci]"
            git push
          fi
